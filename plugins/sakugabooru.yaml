# Sakugabooru (www.sakugabooru.com), a Moebooru site: clips of notable animation, mostly short videos; safe for work.
# No account needed (Vitrine doesn't sign in there): fav:<user name> downloads
# someone's favorites.
id: sakugabooru
name: Sakugabooru
version: 1.0.0
engine: moebooru
base: https://www.sakugabooru.com
post_url: https://www.sakugabooru.com/post/show/{id}
domains: [sakugabooru.com]
limits: {requests_per_sec: 2, connections: 2, max_connections: 4}
search:
  per_page: 200
  hint: "e.g. blue_sky -cloud; ~a ~b for either; fav:<name> for someone's favorites"
ratings: {s: general, q: questionable, e: explicit}
# Tag types come with every page; these become namespaces.
tags:
  types: post
  namespaces: {artist: creator, circle: creator, copyright: series, character: character, faults: meta, meta: meta}
