# Danbooru, the original Danbooru site (anime-style art; has adult content).
# An account is optional: without one a search can have two tags and some
# posts' files are hidden (those are passed over). With one, fav:me downloads
# your favorites.
id: danbooru
name: Danbooru
version: 1.1.0
engine: danbooru
base: https://danbooru.donmai.us
post_url: https://danbooru.donmai.us/posts/{id}
domains: [donmai.us] # files are on cdn.donmai.us
auth:
  fields: [login, api_key]
  help: >-
    Optional. Your user name, and an API key from danbooru.donmai.us > My Account > API Key
    (only the posts:index and posts:show permissions are needed).
# Files from cdn.donmai.us (a CDN: each connection its own speed): up to 6 at once where more add up (Vitrine 1.0.6+
# measures and keeps more only while the total rises).
limits: {requests_per_sec: 2, connections: 3, max_connections: 6}
search:
  per_page: 200
  hint: "e.g. blue_sky -cloud (two tags without an account); ~a ~b for either"
ratings: {g: general, s: sensitive, q: questionable, e: explicit}
# Tag types come with every post; these become namespaces.
tags:
  types: post
  namespaces: {artist: creator, copyright: series, character: character, meta: meta}
